name: banco

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banco}
      POSTGRES_USER: ${POSTGRES_USER:-banco_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banco_clave}
    volumes:
      # Se ejecuta solo la primera vez, cuando el volumen de datos esta vacio.
      - ./BaseDatos.sql:/docker-entrypoint-initdb.d/01-BaseDatos.sql:ro
      - datos:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-banco}
      DB_USER: ${POSTGRES_USER:-banco_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-banco_clave}
      LIMITE_DIARIO_RETIRO: ${LIMITE_DIARIO_RETIRO:-1000}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${ZONA_HORARIA:-America/Tegucigalpa}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/clientes || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  datos:
