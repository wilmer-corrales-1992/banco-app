<app-encabezado-pagina titulo="Clientes" [(busqueda)]="listado.busqueda" (accion)="nuevo()" />

<app-tabla-datos
  descripcion="Listado de clientes"
  [columnas]="columnas"
  [filas]="listado.filtrados()"
  [identificador]="identificador"
  [cargando]="listado.cargando()"
  [mensajeVacio]="
    listado.busqueda() ? 'Ningún cliente coincide con la búsqueda' : 'No hay clientes registrados'
  "
>
  <ng-template [appAccionesFila]="listado.filtrados()" let-cliente>
    <button type="button" class="accion" (click)="editar(cliente)">Editar</button>
    <button type="button" class="accion" (click)="cambiarEstado(cliente)">
      {{ cliente.estado ? 'Desactivar' : 'Activar' }}
    </button>
    <button type="button" class="accion accion--peligro" (click)="porEliminar.set(cliente)">
      Eliminar
    </button>
  </ng-template>
</app-tabla-datos>

@if (formularioAbierto()) {
  <app-modal
    [titulo]="seleccionado() ? 'Editar cliente' : 'Nuevo cliente'"
    (cerrar)="formularioAbierto.set(false)"
  >
    <app-cliente-formulario
      [cliente]="seleccionado()"
      (guardado)="alGuardar($event)"
      (cancelado)="formularioAbierto.set(false)"
    />
  </app-modal>
}

@if (porEliminar(); as cliente) {
  <app-dialogo-confirmacion
    titulo="Eliminar cliente"
    [mensaje]="
      '¿Eliminar al cliente ' +
      cliente.nombre +
      ' (' +
      cliente.clienteId +
      ')? Esta acción no se puede deshacer.'
    "
    [procesando]="eliminando()"
    (confirmar)="eliminar()"
    (cancelar)="porEliminar.set(null)"
  />
}
